name: Update projects index

on:
  schedule:
    # 06:00 America/Mexico_City (UTC-6, no DST) = 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh projects list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_projects.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_data/projects.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update projects index"
            git push
          fi
