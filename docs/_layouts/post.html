---
layout: default
---
<article class="post">
  <p class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% if page.tags %}· {% for tag in page.tags %}<span class="tag">{{ tag }}</span> {% endfor %}{% endif %}
  </p>
  <h1>{{ page.title }}</h1>
  {% if page.links %}
  <p class="links">
    {% for link in page.links %}<a href="{{ link.url }}">{{ link.label }}</a> {% endfor %}
  </p>
  {% endif %}
  {{ content }}
  <p><a href="{{ '/' | relative_url }}">← All projects</a></p>
</article>
